name: Keep HuggingFace Space Alive

on:
  schedule:
    # Run every 10 minutes (HF free tier sleeps after ~48h of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HuggingFace Space
        run: |
          echo "Pinging DriveSafe AI Space..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://ankushkarmakar-drivesafe-ai-v2.hf.space" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Space is alive!"
              exit 0
            fi
            sleep 5
          done
          echo "Warning: Space did not respond with 200 after 3 attempts"
          # Don't fail the workflow - Space might be cold-starting
          exit 0
